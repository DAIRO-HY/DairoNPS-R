<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {{template include/head}}
    <title>数据转发编辑/添加</title>
</head>
<body>
{{template include/top-bar}}
{{template include/data_len_chart}}
{{template include/speed_chart}}
<div class="m-3 p-2 bg-white rounded">
    <form action="/forward/edit">
        <input type="hidden" name="id" value="0">
        <div class="row row-cols-1 row-cols-sm-2">
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">转发名称</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="name" autocomplete="off">
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">流量实时统计</label>
                    <div class="col-8 pt-2">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="isStatsTraffic" id="isStatsTrafficFalse"
                                   value="false">
                            <label class="form-check-label" for="isStatsTrafficFalse">否（高性能）</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="isStatsTraffic" id="isStatsTrafficTrue"
                                   value="true">
                            <label class="form-check-label" for="isStatsTrafficTrue">是</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">端口</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="serverPort" autocomplete="off">
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">目标端口(ip:端口)</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="targetPort" autocomplete="off">
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">入网流量</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="inLen" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">出网流量</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="outLen" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">启用状态</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="isEnabled" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">创建时间</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="createdAt" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">备注</label>
                    <div class="col-8">
                        <textarea class="form-control" name="remark"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <div>
            <div class="text-end mt-3">
                <button type="button" class="btn btn-primary" onclick="onSubmitClick()">提交</button>
            </div>
        </div>
    </form>
</div>
<input id="initAclIp" type="hidden" th:value="${aclIp}">
<script>
    $(function () {
        const forwardId = getParam("id")
        if (forwardId !== "") {//网速统计报表显示
            showDataLenChart(0, 0, forwardId)
            showSpeedChart({forwardId})
        }
        getDetail()
    })

    /**
     * 获取初始数据
     */
    function getDetail() {
        let id = getParam("id" , "0")
        $.ajaxByData("/forward/detail?id=" + id)
            .success(data => {
                $("form").bindValue(data)
            }).get()
    }

    /**
     * 表单提交点击事件
     */
    function onSubmitClick() {
        $("form").ajaxByForm().success(() => {
            window.location = "/forward_list.html"
        }).post()
    }
</script>
</body>
</html>
