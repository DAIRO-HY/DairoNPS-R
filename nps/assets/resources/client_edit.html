<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {{template include/head}}
    <title>客户端编辑</title>
</head>
<body>
{{template include/top-bar}}
{{template include/data_len_chart}}
{{template include/speed_chart}}
<div class="m-3 p-2 bg-white rounded">
    <form action="/client/edit">
        <input type="hidden" id="id" name="id" value="0">
        <input type="hidden" id="version" name="version" value="0">
        <div class="row row-cols-1 row-cols-sm-2">
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">名称</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="name" autocomplete="off">
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">认证秘钥</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="key" autocomplete="off">
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">客户端版本</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="client_version" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">客户端IP</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="ip" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">入网流量</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="inLen" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">出网流量</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="outLen" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">在线状态</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="onlineState" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">启用状态</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="enableState" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">最后登录时间</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="lastLoginDate" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">最后更新时间</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="updatedAt" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">创建时间</label>
                    <div class="col-8">
                        <input type="text" class="form-control" name="createdAt" disabled>
                    </div>
                </div>
            </div>
            <div class="col mt-2">
                <div class="row">
                    <label class="col-4 col-form-label text-end">备注</label>
                    <div class="col-8">
                        <textarea class="form-control" name="remark"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-3">
            <div class="text-end">
                <button type="button" class="btn btn-primary" onclick="onSubmitClick()">提交</button>
            </div>
        </div>
    </form>
</div>
<script>

    $(function () {
        const clientId = getParam("id")
        if (clientId !== "") {//网速统计报表显示
            showDataLenChart(clientId, 0, 0)
            showSpeedChart({clientId})
        }
        init()
    })

    function init() {
        let id = getParam("id", "0")
        $.ajaxByData("/client/detail?id=" + id).success(data => {
            $("form").bindValue(data)
        }).get()
    }

    /**
     * 表单提交点击事件
     */
    function onSubmitClick() {
        $("form").ajaxByForm().success(() => {
            window.location = "/client_list.html"
        }).post()
    }
</script>
</body>
</html>
