[package]
name = "DairoNPS"
version = "2.0.0"
edition = "2024"

# build.rs 专用的依赖
[build-dependencies]
lib_db = { path = "../lib_db" }
lib_source_gen = { path = "../lib_source_gen" }
pollster = "0.3"

#注解路由代码生成（0.0.5未发布前使用本地路径）
hyperoute-codegen = { path = "/Users/zhoulq/dev/java/idea/Rust/hyperoute/hyperoute-codegen", version = "0.0.5" }

[dependencies]
lib_db = { path = "../lib_db" }
lib_source_gen = { path = "../lib_source_gen" }
lib_np_common = { path = "../lib_np_common" }
md5 = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }

#用来解析启动参数
clap = { version = "4", features = ["derive", "env"]}
chrono = "0.4" # 日期时间处理
serde = { version = "1", features = ["derive","rc"] }
serde_json = "1.0"
regex = "1"
mime_guess = "2"
rand = { version = "0.10", features = ["std"] }
bytes = "1"
dashmap = "6"
#rusqlite = { version = "0.38", features = ["bundled"] }
rust-embed = "8" #嵌入文件

#注解路由（0.0.5未发布前使用本地路径）
hyperoute-core = { path = "/Users/zhoulq/dev/java/idea/Rust/hyperoute/hyperoute-core", version = "0.0.5" }
hyperoute-macro = { path = "/Users/zhoulq/dev/java/idea/Rust/hyperoute/hyperoute-macro", version = "0.0.5" }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
tokio-stream = "0.1"

#表单验证
validator = { version = "0.20", features = ["derive"] }
maplit = "1.0"
itertools = "0.14"
#sysinfo = "0.38"

#适合读非常多,写非常少的场景,比如配置文件,全局状态等
arc-swap = "1"
