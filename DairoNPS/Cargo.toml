[package]
name = "DairoNPS"
version = "0.1.0"
edition = "2024"

# build.rs 专用的依赖
[build-dependencies]
db = { path = "../db" }
source_gen = { path = "../source_gen" }
pollster = "0.3"

[dependencies]
db = { path = "../db" }
source_gen = { path = "../source_gen" }
np_common = { path = "../np_common" }
md5 = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }

#用来解析启动参数
clap = { version = "4", features = ["derive"] }
chrono = "0.4" # 日期时间处理
serde = { version = "1", features = ["derive","rc"] }
serde_json = "1.0"
regex = "1"
mime_guess = "2"
rand = { version = "0.10", features = ["std"] }
bytes = "1"
dashmap = "6"
#rusqlite = { version = "0.38", features = ["bundled"] }
rust-embed = "8" #嵌入文件
axum = { version = "0.8", features = [
    "macros",      # 可选：便捷宏（如 routing 宏）
    "http1",       # 一般需要
    "http2",       # 若要 h2
    "json",        # 用到 Json 提取/响应
    "multipart",   # 用到 Multipart
] }
tokio-stream = "0.1"
axum-extra = { version = "0.12", features = ["cookie"] }
futures = "0.3"

#表单验证
validator = { version = "0.20", features = ["derive"] }
maplit = "1.0"
itertools = "0.14"
#sysinfo = "0.38"

#适合读非常多,写非常少的场景,比如配置文件,全局状态等
arc-swap = "1"
