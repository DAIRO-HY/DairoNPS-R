[package]
name = "DairoNPS"
version = "2.0.0"
edition = "2024"

# build.rs 专用的依赖
[build-dependencies]
async-std = { version = "1", features = ["attributes"] }

#静态资源路由生成
axum-static-embed = "0.0.1"
lib_db = { path = "../lib_db" }
sqlx-dsl-dao = "0.0.1"
#pollster = "0.3"

[dependencies]

# 接管内存分配,比系统分配收益更高
mimalloc = "0.1.52"

#表单宏处理
axum-request-macros = "0.1.0"

#文件上传工具
axum-multipart-file = "0.0.1"
lib_db = { path = "../lib_db" }
#sqlx-dsl-dao = { path = "../sqlx-dsl-dao" }
lib_np_common = { path = "../lib_np_common" }
lib_axum_extract = { path = "../lib_axum_extract" }
md5 = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
sqlx = { version = "0.8", features = [
    "sqlite",
    "runtime-tokio",
    "macros",

    # 可选：如果需要使用 sqlx 的时间类型支持，则启用 "chrono" 功能
    "chrono"
] }

#数据库操作上下文:持有连接池,以及可选的当前事务。
sqlx-context = "0.0.1"

#用来解析启动参数
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] } # 日期时间处理
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1.0"
regex = "1"
rand = { version = "0.10", features = ["std"] }
bytes = "1"
dashmap = "6"
#rusqlite = { version = "0.38", features = ["bundled"] }
rust-embed = "8" #嵌入文件
axum = { version = "0.8", features = [
    "macros", # 可选：便捷宏（如 routing 宏）
    "http1", # 一般需要
    "http2", # 若要 h2
    "json", # 用到 Json 提取/响应
    "multipart", # 用到 Multipart
] }
tower-http = { version = "0.7", features = ["fs"] }
tower = { version = "0.5", features = [
    "timeout",
    "limit",
    "util",
] }
tokio-stream = "0.1"
axum-extra = { version = "0.12", features = ["cookie"] }
futures = "0.3"

#表单验证
validator = { version = "0.20", features = ["derive"] }
maplit = "1.0"
itertools = "0.14"
#sysinfo = "0.38"

#适合读非常多,写非常少的场景,比如配置文件,全局状态等
arc-swap = "1"
quote = "1.0.45"
syn = "2.0.117"
multer = "3.1.0"
uuid = { version = "1.23.3", features = ["v4"] }
form_urlencoded = "1"
image = "0.25.10"

base64 = "0.22"
hmac = "0.13"
percent-encoding = "2"
sha1 = "0.11"
url = "2"
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }

#  excel导出
rust_xlsxwriter = "0.96"
serde_urlencoded = "0.7.1"

