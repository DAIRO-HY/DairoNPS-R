<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {{template include/head}}
    <title>端口转发</title>
</head>
<body>
{{template include/top-bar}}
<div class="mx-0 mt-3">
    <div id="list" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-0">
    </div>
</div>
<script>
    $(function () {
        addNavBtn("添加", () => {
            window.location.href = "/forward_edit.html"
        })
        init()
    });

    function init() {
        $.ajaxByData("/api/forward/list").success(data => {
            fillData(data)
        }).get()
    }

    /**
     * 填充数据
     * @param data
     */
    function fillData(data) {
        const $list = $("#list").empty()
        data.forEach(item => {
            $list.append(`
            <div class="col px-0 pb-3 px-3">
                <div class="bg-white rounded p-2 position-relative">
                    <div class="text-center fs-5">${item.name}</div>
                    <div>端口:<span>${item.serverPort}</span> -> <span>${item.targetPort}</span></div>
                    <div>入网:<span>${item.inLen}</span> &nbsp;&nbsp;出网<span>${item.outLen}</span></div>
                    <div class="text-danger" style="${item.error ? "":"display: none"}">${item.error ?? ""}</div>
                    <div class="text-end">
                        <button class="btn btn-sm btn-outline-danger" onclick="onSetStateClick(${item.id})">
                            <i class="bi ${item.isEnabled ? "bi-pause-fill" : "bi-play-fill"}"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="onDeleteClick(${item.id})">
                            <i class="bi bi-trash3"></i>
                        </button>
                        <a class="btn btn-sm btn-outline-primary" href="/forward_edit.html?id=${item.id}">
                           <i class="bi bi-pencil-square"></i>
                        </a>
                    </div>
                </div>
            </div>
          `)
        })
    }

    /**
     * 删除点击事件
     * @param id
     */
    function onDeleteClick(id) {
        if (!confirm("确定删除?")) {
            return
        }
        $.ajaxByData("/api/forward/delete?id=" + id).success(() => {
            init()
        }).delete()
    }

    /**
     * 修改可用状态
     * @param id
     */
    function onSetStateClick(id) {
        $.ajaxByData("/api/forward/toggle_enable?id=" + id).success(() => {
            init()
        }).put()
    }
</script>
</body>
</html>
